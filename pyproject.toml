[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ml-internship-projects"
version = "1.0.0"
description = "Ten reproducible AI/ML internship projects with Streamlit interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI/ML Internship Projects" }]

[tool.setuptools]
packages = ["shared"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "slow: tests that train a model or download a dataset (deselect with '-m \"not slow\"')",
    "network: tests that require internet access",
]
filterwarnings = [
    "ignore::DeprecationWarning:sklearn.*",
    "ignore::FutureWarning:sklearn.*",
    "ignore::UserWarning:sklearn.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]